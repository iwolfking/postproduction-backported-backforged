        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath files(
            '/var/home/iwolfking/.gradle/caches/modules-2/files-2.1/org.parchmentmc/librarian/1.2.0.7-dev-SNAPSHOT/b0fd8076cb1216bd1efdbc7b4dd04569f845aa26/librarian-1.2.0.7-dev-SNAPSHOT.jar',
            '/var/home/iwolfking/.gradle/caches/modules-2/files-2.1/org.parchmentmc.feather/io-gson/0.6.5/55a10836f46a73c896d59fc9f3a4f8d33b610815/io-gson-0.6.5.jar',
            '/var/home/iwolfking/.gradle/caches/modules-2/files-2.1/org.parchmentmc/feather/0.6.5/38852a16b4adf974081beea0af1e2d2e81b337ab/feather-0.6.5.jar'
